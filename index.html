<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gay Animals of Society</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff6fae; --pink2:#ffd1e6; --green:#4fa65e; --cream:#fffaf2; --ink:#3d2a33; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Fredoka, system-ui, sans-serif; color:var(--ink); min-height:100vh;

  .bgl { position:fixed; inset:-20px; background-size:cover; background-position:center; opacity:0; transition:opacity 1.4s ease;
         z-index:-1; filter:blur(3px) brightness(.85); }

  .bunting { position:fixed; top:0; left:0; right:0; height:34px; z-index:0; pointer-events:none;
             background:repeating-linear-gradient(90deg,#ff3b3b 0 40px,#ff9f1a 40px 80px,#ffe11a 80px 120px,#3ad15a 120px 160px,#2f8cff 160px 200px,#a35cff 200px 240px);

  @keyframes drift { from{transform:translateY(110vh) rotate(0)} to{transform:translateY(-15vh) rotate(360deg)} }
  .arc { position:fixed; left:50%; bottom:-38vw; width:110vw; height:110vw; transform:translateX(-50%); border-radius:50%; z-index:0; pointer-events:none; opacity:.35;
         background:radial-gradient(circle, transparent 52%, #a35cff 52% 55%, #2f8cff 55% 58%, #3ad15a 58% 61%, #ffe11a 61% 64%, #ff9f1a 64% 67%, #ff3b3b 67% 70%, transparent 70%); }
  #app { width:min(780px,100%); margin:0 auto; padding:20px 16px 140px; position:relative; z-index:1; }
  .trees { position:fixed; bottom:-8px; left:0; right:0; font-size:72px; white-space:nowrap; overflow:hidden;
           opacity:.6; pointer-events:none; z-index:0; letter-spacing:-10px; }
  h1 { font-size:clamp(42px,9vw,72px); text-align:center; margin:16px 0 4px; color:#fff;
       text-shadow:0 4px 0 var(--pink), 0 8px 18px rgba(0,0,0,.18); }
  h2 { margin:0 0 10px; font-size:28px; }
  .rb { background:linear-gradient(90deg,#ff3b3b,#ff9f1a,#ffe11a,#3ad15a,#2f8cff,#a35cff); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 8px rgba(0,0,0,.2)); }
  .cover { background:rgba(255,255,255,.55); border-radius:32px; padding:18px 16px 26px; margin-top:30px;
           box-shadow:0 0 0 6px #ff3b3b, 0 0 0 12px #ff9f1a, 0 0 0 18px #ffe11a, 0 0 0 24px #3ad15a, 0 0 0 30px #2f8cff, 0 0 0 36px #a35cff, 0 20px 50px rgba(0,0,0,.2); margin:48px 36px; }
  .cover-flags { text-align:center; font-size:46px; }
  .wave { display:inline-block; animation:wave 1.2s ease-in-out infinite; transform-origin:bottom left; margin:0 10px; }
  .wave.two { animation-delay:.3s; }
  @keyframes wave { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(10deg)} }
  .lil { text-align:center; font-size:30px; font-weight:700; margin:0 0 8px; }
  .couples { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 26px; font-size:58px; }
  .beat { display:inline-block; font-size:34px; animation:beat 1s ease-in-out infinite; vertical-align:middle; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }
  .big-btn { font-size:28px; padding:16px 40px; box-shadow:0 5px 0 #8a4bd1; }
  @media (max-width:520px){ .cover{ margin:40px 20px; } }
  .glade { background:url(art/glade.png) center/cover, radial-gradient(circle at 50% 30%, #ffe9f6 0%, #ffc4e4 25%, #7fcf9a 60%, #2f6e4e 100%); color:#fff; }
  .fly { position:absolute; width:9px; height:9px; border-radius:50%; background:#fff6a8; box-shadow:0 0 10px 4px #fff28a;
         animation:fly ease-in-out infinite alternate; pointer-events:none; }
  @keyframes fly { 0%{transform:translate(0,0);opacity:.2} 50%{opacity:1} 100%{transform:translate(30px,-25px);opacity:.3} }
  /* ===== animations ===== */
  #app.enter > * { animation: popIn .55s cubic-bezier(.2,1.4,.4,1) both; }
  #app.enter > *:nth-child(2){animation-delay:.1s} #app.enter > *:nth-child(3){animation-delay:.2s}
  #app.enter > *:nth-child(4){animation-delay:.3s} #app.enter > *:nth-child(5){animation-delay:.4s}
  @keyframes popIn { from{opacity:0; transform:translateY(30px) scale(.95)} to{opacity:1; transform:none} }
  .word { display:inline-block; animation: wordPop .35s both; }
  @keyframes wordPop { from{opacity:0; transform:translateY(10px) scale(.7)} to{opacity:1; transform:none} }
  .w1, .w2 { display:inline-block; }
  .scene .pair, .scene .bubble, .scene p, .scene .center { position:relative; z-index:1; }
  .pair.walk .w1 { animation: walkL 1.3s ease-out both; }
  .pair.walk .w2 { animation: walkR 1.3s ease-out both; }
  @keyframes walkL { 0%{transform:translateX(-320px) rotate(-10deg)} 25%{transform:translateX(-240px) rotate(10deg)} 50%{transform:translateX(-160px) rotate(-10deg)} 75%{transform:translateX(-80px) rotate(10deg)} 100%{transform:none} }
  @keyframes walkR { 0%{transform:translateX(320px) rotate(10deg)} 25%{transform:translateX(240px) rotate(-10deg)} 50%{transform:translateX(160px) rotate(10deg)} 75%{transform:translateX(80px) rotate(-10deg)} 100%{transform:none} }
  .pair.happy .w1, .pair.happy .w2 { animation: jump .5s ease-out 3; }
  .pair.happy .w2 { animation-delay:.12s; }
  @keyframes jump { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-50px) rotate(-6deg)} }
  .pair.nod .w2 { animation: nod .45s ease-in-out 3; }
  @keyframes nod { 0%,100%{transform:rotate(0)} 50%{transform:translateY(8px) rotate(6deg)} }
  .pair.confused .w2 { animation: shake .35s ease-in-out 3; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px) rotate(-8deg)} 75%{transform:translateX(12px) rotate(8deg)} }
  .pair.close .w1 { animation: toR 1.6s ease-in-out .4s both; }
  .pair.close .w2 { animation: toL 1.6s ease-in-out .4s both; }
  @keyframes toR { to{transform:translateX(26px)} } @keyframes toL { to{transform:translateX(-26px)} }
  .pair.boop .w1 { animation: boopR 1.5s ease-in-out .5s both; }
  .pair.boop .w2 { animation: boopL 1.5s ease-in-out .5s both; }
  @keyframes boopR { 0%{transform:none} 70%{transform:translateX(40px)} 80%{transform:translateX(28px)} 100%{transform:translateX(34px)} }
  @keyframes boopL { 0%{transform:none} 70%{transform:translateX(-40px)} 80%{transform:translateX(-28px)} 100%{transform:translateX(-34px)} }
  .pair.aisle .w1, .pair.aisle .w2 { animation: aisle 2.4s ease-out both; }
  @keyframes aisle { 0%{transform:translateY(160px) scale(.5); opacity:0} 20%{opacity:1} 40%{transform:translateY(100px) scale(.65) rotate(-5deg)} 60%{transform:translateY(55px) scale(.8) rotate(5deg)} 80%{transform:translateY(20px) scale(.92) rotate(-3deg)} 100%{transform:none} }
  .burst { position:absolute; left:50%; top:40%; font-size:64px; z-index:2; pointer-events:none; animation: burst 1.4s ease-out .5s both; }
  @keyframes burst { 0%{transform:translate(-50%,-50%) scale(0); opacity:0} 35%{transform:translate(-50%,-50%) scale(1.7); opacity:1} 100%{transform:translate(-50%,-130%) scale(1); opacity:0} }
  .giftfly { position:absolute; left:50%; top:38%; font-size:54px; z-index:2; pointer-events:none; animation: giftArc 1.2s ease-in-out both; }
  @keyframes giftArc { 0%{transform:translate(-170px,30px) scale(.4); opacity:0} 15%{opacity:1} 50%{transform:translate(-40px,-90px) scale(1.4) rotate(180deg)} 100%{transform:translate(70px,10px) scale(1) rotate(360deg); opacity:1} }
  .stomp { display:inline-block; animation: stomp .5s ease-in-out infinite; }
  @keyframes stomp { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-14px) rotate(-10deg)} }
  .hopin { display:inline-block; animation: hopIn 1.6s ease-out .4s both, bob 1.6s ease-in-out 2s infinite; }
  @keyframes hopIn { 0%{transform:translateY(160px); opacity:0} 30%{transform:translateY(-40px); opacity:1} 50%{transform:translateY(0)} 70%{transform:translateY(-20px)} 100%{transform:translateY(0)} }
  .walkacross { animation: across 5s ease-in-out infinite alternate; }
  @keyframes across { from{transform:translateX(-110px)} to{transform:translateX(110px)} }
  .beat2 { display:inline-block; animation: beat 1s ease-in-out infinite; }
  .amb { position:absolute; top:-12%; font-size:26px; pointer-events:none; z-index:0; animation: ambFall linear infinite; }
  @keyframes ambFall { from{transform:translateY(0) rotate(0)} to{transform:translateY(480px) rotate(360deg)} }
  .amb.flut { animation: flutter ease-in-out infinite alternate; }
  @keyframes flutter { from{transform:translate(0,0) rotate(-10deg)} to{transform:translate(50px,-40px) rotate(15deg)} }
  .amb.twinkle { animation: twinkle ease-in-out infinite alternate; }
  @keyframes twinkle { from{opacity:.15; transform:scale(.6)} to{opacity:1; transform:scale(1.2)} }
  h1 { animation: titleGlow 2.5s ease-in-out infinite; }
  @keyframes titleGlow { 0%,100%{transform:rotate(-1deg) scale(1)} 50%{transform:rotate(1deg) scale(1.03)} }
  .laugh { display:inline-block; animation: laugh .3s ease-in-out infinite; }
  .laugh:nth-of-type(odd) { animation-delay:.15s; }
  @keyframes laugh { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-10px) rotate(6deg)} }
  .bully-pair { gap:14px; flex-wrap:wrap; }
  .haha { position:absolute; z-index:2; font-weight:700; font-size:24px; color:#444; background:rgba(255,255,255,.8); padding:2px 10px; border-radius:12px;
          pointer-events:none; animation: haha 2.6s ease-out infinite both; }
  @keyframes haha { 0%{opacity:0; transform:scale(.4) rotate(-10deg)} 20%{opacity:1; transform:scale(1.15) rotate(6deg)} 70%{opacity:1} 100%{opacity:0; transform:translateY(-40px) scale(1)} }
  .pic { height:150px; width:auto; vertical-align:bottom; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
  .w2 .pic, .couples span:last-child .pic, .bully-pair .laugh .pic { transform:scaleX(-1); }
  .big .pic { height:120px; }
  .emo .pic { height:90px; }
  .grid button .pic { height:64px; }
  .couples .pic { height:84px; }
  .couples span:first-child .pic { transform:none; }
  .bully-pair .pic { height:120px; }
  .hopin .pic { height:80px; }
  .scene { background-size:cover; }
  .scene p.story, .scene .story { text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .banner { background:url(art/village.png) center/cover, linear-gradient(#bde6ff,#a6d98f); border-radius:26px; height:220px;
            display:flex; align-items:flex-end; justify-content:center; padding-bottom:14px; box-shadow:0 8px 24px rgba(0,0,0,.15); margin:10px 0; }
  .hs { width:1em; height:1em; vertical-align:-0.12em; display:inline-block; }
  .floaty .hs { width:44px; height:44px; }
  .confetti .hs { width:26px; height:26px; }
  .burst .hs { width:80px; height:80px; }
  .beat .hs, .beat2 .hs { width:44px; height:44px; }
  .hearts .hs { width:22px; height:22px; margin-right:2px; }
  .itm { height:54px; width:auto; vertical-align:middle; margin-right:8px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.2)); }
  .grid .itm { height:70px; margin:0; display:block; }
  .lbl { display:block; font-size:15px; }
  .big-itm { height:90px; }
  .acc { position:absolute; left:50%; top:-28px; transform:translateX(-50%); height:70px; z-index:2; }
  .w1 .bob, .w2 .bob { position:relative; display:inline-block; }
  .crowd .pic { height:64px; margin:0 -6px; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .flag { display:inline-block; width:66px; height:44px; border-radius:4px; box-shadow:0 3px 8px rgba(0,0,0,.25);
          background:linear-gradient(#e40303 0 16.66%,#ff8c00 0 33.33%,#ffed00 0 50%,#008026 0 66.66%,#24408e 0 83.33%,#732982 0); }
  .scene .place-name { z-index:2; }
  .sub { color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .box .sub, .cover .sub { color:var(--ink); text-shadow:none; }
  .side-go { position:fixed; right:100px; top:50%; transform:translateY(-50%); z-index:5; font-size:22px; line-height:1.25;
             padding:22px 18px; border-radius:24px; animation: nudge 1.4s ease-in-out infinite; }
  .side-go:hover { transform:translateY(-50%) scale(1.05); }
  @keyframes nudge { 0%,100%{transform:translateY(-50%) translateX(0)} 50%{transform:translateY(-50%) translateX(-8px)} }
  @media (max-width:700px){ .side-go { top:auto; bottom:16px; transform:none; right:16px; animation:none; } .side-go:hover{transform:none;} }
  .type-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .type-row input { flex:1; min-width:200px; max-width:none; }
  .type-row button { margin:0; }
  .bubble.you { background:#e9f4ff; margin-left:40px; }
  .pair.fight .w1 .pic { transform:scaleX(-1); }
  .pair.fight .w2 .pic { transform:none; }
  .pair.fight .w1 { animation: huff 1s ease-in-out infinite; }
  .pair.fight .w2 { animation: huff 1s ease-in-out .5s infinite; }
  @keyframes huff { 0%,100%{transform:translateX(0)} 50%{transform:translateY(-6px)} }
  .storm { position:absolute; left:50%; top:20px; width:120px; height:50px; transform:translateX(-50%); z-index:2;
           background:radial-gradient(circle at 30% 60%,#556 0 22px,transparent 23px),radial-gradient(circle at 55% 40%,#667 0 28px,transparent 29px),radial-gradient(circle at 78% 62%,#556 0 20px,transparent 21px);
           animation: shake .5s ease-in-out infinite; }
  .phone-btn { position:fixed; left:18px; bottom:18px; z-index:20; width:64px; height:64px; border-radius:20px; padding:0;
               display:flex; align-items:center; justify-content:center; background:#2b2233; box-shadow:0 5px 0 #120d16; }
  .badge { position:absolute; top:-8px; right:-8px; min-width:26px; height:26px; border-radius:13px; background:#e8344e; color:#fff;
           font-size:15px; display:flex; align-items:center; justify-content:center; padding:0 6px; animation: beat 1s infinite; }
  .phone { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
  .ph-screen { width:min(360px,92vw); height:min(640px,86vh); background:#fff; border:12px solid #2b2233; border-radius:40px;
               display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4); animation: popIn .4s both; }
  .ph-top { display:flex; align-items:center; gap:10px; padding:14px; background:#fbe9f2; font-size:20px; }
  .ph-top img { height:40px; }
  .ph-x { font-size:15px; padding:8px 12px; margin:0; margin-left:auto; }
  .ph-top .ph-x:first-child { margin-left:0; }
  .ph-contact { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid #f0e0e8; cursor:pointer; position:relative; }
  .ph-contact:hover { background:#fff4f9; }

  .ph-contact .badge { position:static; margin-left:auto; animation:none; }

  .ph-pic .photo .pitem { position:absolute; bottom:10px; right:12px; height:46%; filter:drop-shadow(0 3px 5px #0005); }
  .ph-pic .photo.selfie .pitem { right:6px; height:36%; }
  .ph-pic .cap { padding:7px 6px 3px; }

  .ph-type { display:flex; gap:6px; padding:10px; border-top:1px solid #f0e0e8; }

let actx;
function chime(good = true) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [660, 880, 1100] : [400, 330];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.18, actx.currentTime + i * .1);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + i * .1 + .35);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i * .1); o.stop(actx.currentTime + i * .1 + .4);
    });
  } catch (e) {}
}

function wordsIn(el, step) {
  let d = 0.35;
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(w => {
        if (!w) return;
        if (/^\s+$/.test(w)) return frag.appendChild(document.createTextNode(w));
        const sp = document.createElement("span");
        sp.className = "word"; sp.textContent = w; sp.style.animationDelay = d.toFixed(2) + "s"; d += step;
        frag.appendChild(sp);
      });
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && c.tagName !== "BUTTON" && c.tagName !== "INPUT") walk(c);
  });
  walk(el);
}
const ART = { "🦊":"fox","🐰":"bunny","🦝":"raccoon","🐻":"bear","🦌":"deer","🦔":"hedgehog","🐿️":"squirrel","🐿":"squirrel",
  "🦉":"owl","🐺":"wolf","🐭":"mouse","🦡":"badger","🦦":"weasel","🐦‍⬛":"magpie" };
const ART_RE = new RegExp("(" + Object.keys(ART).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gu");
const HAVE = new Set();
const ART_READY = Promise.all([...new Set([...Object.values(ART), ...Object.values(ITEM_ART), "village","picnic","stars","pond","garden","glade","path"])].map(n => new Promise(res => {
  const im = new Image(); im.onload = () => { HAVE.add(n); res(); }; im.onerror = res; im.src = `art/${n}.png`;
})));
function artify(root) {
  root.querySelectorAll(".pair, .big, .emo, .couples, .grid button, .scene .center, .me-in-room, .guest-in-room").forEach(el => {
    const walk = n => [...n.childNodes].forEach(c => {
      if (c.nodeType === 3 && ART_RE.test(c.textContent)) {
        ART_RE.lastIndex = 0;
        const frag = document.createDocumentFragment();
        c.textContent.split(ART_RE).forEach(part => {
          if (!part) return;
          const name = ART[part];
          if (name && HAVE.has(name)) {
            const im = document.createElement("img");
            im.src = `art/${name}.png`; im.className = "pic"; im.alt = name;
            frag.appendChild(im);
          } else frag.appendChild(document.createTextNode(part));
        });
        c.replaceWith(frag);
      } else if (c.nodeType === 1) walk(c);
      ART_RE.lastIndex = 0;
    });
    walk(el);
  });
}
const EMOJI_RE = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u20E3|\p{Emoji_Modifier}|\u200D(?:\p{Extended_Pictographic}|\uFE0F)*)*|\uFE0F|\u200D/gu;
function noEmoji(root) {
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      if (!EMOJI_RE.test(c.textContent)) { EMOJI_RE.lastIndex = 0; return; }
      EMOJI_RE.lastIndex = 0;
      const frag = document.createDocumentFragment(); let last = 0, m;
      const t = c.textContent;
      while ((m = EMOJI_RE.exec(t))) {
        frag.appendChild(document.createTextNode(t.slice(last, m.index)));
        const col = HEART_COL[m[0]] || HEART_COL[m[0].replace(/\uFE0F/g, "")];
        if (col) { const sp = document.createElement("span"); sp.className = "hh"; sp.innerHTML = heartSVG(col); frag.appendChild(sp); }
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(t.slice(last).replace(/^\s+(?=[.!?,])/, "")));
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && c.tagName !== "SVG" && c.tagName !== "svg") walk(c);
  });
  walk(root);
}

      if (!b) notify(fname, line);

}

  setTimeout(() => {

  }
  S.day++;
  if (S.day > DAYS) return festivalScreen();
  if (S.day >= 3) return grumbleScreen();
  nextTurn();
}

function nextTurn() {
  if (MODE === 2 && !PLAYERS[1 - TURN].done) { TURN = 1 - TURN; S = PLAYERS[TURN]; return turnScreen(); }
  mapScreen();
}

function turnScreen() {
  setBg("village");
  show(`
    <div class="box center story">
      <div class="big"><span class="bob">${S.animal[0]}</span></div>
      <h2>${esc(S.name)}'s turn! 🎮</h2>
      <p>Pass the computer to <b>${esc(S.name)}</b>.</p>
      <button class="rainbow big-btn" onclick="mapScreen()">Ready! ➜</button>
    </div>
  `);
}

function finishStory(result) {
  S.done = true; S.result = result;
  if (MODE === 2) {
    const other = PLAYERS[1 - TURN];
    if (!other.done) return `<button class="green" onclick="TURN=1-TURN;S=PLAYERS[TURN];turnScreen()">Now it's ${esc(other.name)}'s turn! 🎮</button>`;
    return `<button class="rainbow" onclick="bothDone()">See both stories 🌈</button>`;
  }
  return `<button onclick="newGame();titleScreen()">Play again 🔁</button>`;
}

function bothDone() {
  setBg("glade");
  confetti(); chime();
  show(`
    <div class="box story center">
      <h2>🌈 Both stories are finished! 🌈</h2>
      ${PLAYERS.map(p => `<p style="font-size:26px"><b>${esc(p.name)}</b>: ${p.result}</p>`).join("")}
      <p>Love is love! 💖</p>
      <button onclick="newGame();titleScreen()">Play again 🔁</button>
    </div>
  `);
}

// The mean animals who don't accept you (they learn to be kind if you stand up to them)
const BULLIES = {
  grumble: { name:"Grumble the Badger", emo:"🦡" },
  sneer:   { name:"Sneer the Weasel",   emo:"🦦" },
  cackle:  { name:"Cackle the Magpie",  emo:"🐦‍⬛" }
};
const BULLY_EVENTS = [
  { who:["sneer","cackle"], lines:[["sneer","HAHAHA! Look at {ME} and {F}! Two {W} holding paws? That's SO weird! Hehehe!"],["cackle","Caw caw caw! Weirdos! 😂"]] },
  { who:["grumble"],        lines:[["grumble","Hmph! Two {W} together like that? That's not how things are done in {V}!"]] },
  { who:["sneer","grumble","cackle"], lines:[["sneer","Hey everyone, look! It's the lovebirds! HAHAHA!"],["cackle","Nobody's going to come to YOUR wedding! Caw caw caw! 😂"]] },
  { who:["cackle","sneer"], lines:[["cackle","Psst! Did you hear? They LIKE-like each other! Ewwww! Hehehe!"],["sneer","Hahaha! Gross!"]] }
];
function laughs() {
  let h = "";
  ["HA HA HA!","hehehe","HA!","caw caw!","hahaha","LOL"].forEach((t, k) =>
    h += `<span class="haha" style="left:${45 + Math.random() * 45}%;top:${10 + Math.random() * 50}%;animation-delay:${k * .35}s">${t}</span>`);
  return h;
}
function grumbleScreen() {
  const best = [...friends()].sort((a, b) => S.hearts[b.name] - S.hearts[a.name])[0];
  const ev = BULLY_EVENTS[(S.day - 3) % BULLY_EVENTS.length];
  S.bullyNow = ev.who;
  const fillB = t => fill(t).replaceAll("{ME}", esc(S.name)).replaceAll("{F}", best.name).replaceAll("{V}", VILLAGE);
  show(`
    <div class="scene" style="background:url(art/path.png) center/cover, linear-gradient(#cfd8dc,#a9b8a2)">
      ${laughs()}
      <div class="place-name">🌧️ Village Path</div>
      <div class="pair bully-pair">
        <span class="w1"><span class="bob">${S.animal[0]}</span></span><span class="w2"><span class="bob two">${best.emo}</span></span>
        ${ev.who.map(b => `<span class="laugh">${BULLIES[b].emo}</span>`).join("")}
      </div>
      ${ev.lines.map(([b, t]) => `<div class="bubble"><b>${BULLIES[b].name}:</b> "${fillB(t)}"</div>`).join("")}
    </div>
    <div class="box answers">
      <h2>They're laughing at you. 😔 What do you do?</h2>
      <button class="soft" onclick="grumbleChoice(2,'${best.name}')">💪 "Love is love. Laughing at people isn't funny. Maybe try being kind."</button>
      <button class="soft" onclick="grumbleChoice(1,'${best.name}')">🤝 Hold ${best.name}'s paw and walk on, heads held high.</button>
      <button class="soft" onclick="grumbleChoice(0,'${best.name}')">😢 Feel sad and go home.</button>
    </div>
  `);
}

function grumbleChoice(c, fname) {
  const f = friends().find(x => x.name === fname);
  let txt;
  const names = (S.bullyNow || ["grumble"]).map(b => BULLIES[b].name.split(" ")[0]).join(" and ");
  if (c === 2) { S.grumble += 2; addHearts(f, 1); txt = `The laughing stops. 🤐 ${names} look at their feet. "Hmph... maybe..." They look like they're thinking about it. 🤔<br>${f.name} whispers, "Thank you for standing up for us." <b>+1 ❤️</b>`; }
  else if (c === 1) { S.grumble += 1; addHearts(f, 1); txt = `You and ${f.name} walk past together, smiling. ${f.name} squeezes your paw. <b>+1 ❤️</b>`; }
  else { txt = `You go home feeling sad. But tomorrow is a new day, and ${f.name} leaves a little note at your door: "Don't listen to them. You're amazing. 💌"`; }
  chime(c > 0); if (c > 0) floatHearts(1);
  show(`
    <div class="box story">
      <p>${txt}</p>
      <div class="center"><button onclick="nextTurn()">Next ➜</button></div>
    </div>
  `);
}

function festivalScreen() {
  const best = [...friends()].sort((a, b) => S.hearts[b.name] - S.hearts[a.name])[0];
  if (S.hearts[best.name] >= 7) return confessScreen(best.name, true);
  show(`
    <div class="scene" style="background:url(art/stars.png) center/cover, linear-gradient(#1d2157,#6a3f8c);color:#fff">
      <div class="place-name" style="color:var(--ink)">🏮 Lantern Festival</div>
      <div class="pair"><span class="bob">${S.animal[0]}</span></div>
      <p class="story center">The lanterns float into the sky. You made some lovely friends in ${VILLAGE}! 🏮✨<br>But your special someone is still out there...</p>
    </div>
    <div class="center">${finishStory(`${S.animal[0]} made lovely friends and is still looking for true love 💫`)}</div>
  `);
}

function confessScreen(fname, festival = false) {
  const f = friends().find(x => x.name === fname);
  show(`
    <div class="scene" style="background:url(art/stars.png) center/cover, linear-gradient(#1d2157,#6a3f8c);color:#fff">
      <div class="place-name" style="color:var(--ink)">🏮 ${festival ? "Lantern Festival" : "Under the Old Oak Tree"}</div>
      <div class="pair"><span class="bob">${S.animal[0]}</span><span class="bob two">${f.emo}</span></div>
      <p class="story center">Lanterns glow all around. Your heart is going thump-thump-thump. 💓</p>
      <p class="story center">You think back to your first day together at the ${PLACES[(S.firstPlace||{})[f.name] || "picnic"].name}... how ${f.name} smiled at you... how the whole forest felt a little less lonely after that. 🌲✨</p>
      <p class="story center">It's time to tell ${f.name} how you feel...</p>
    </div>
    <div class="box answers">
      <h2>What do you say?</h2>
      <button class="soft" onclick="yesScreen('${f.name}')">💕 "${f.name}, you make me so happy. Will you be my partner?"</button>
      <button class="soft" onclick="yesScreen('${f.name}')">🌸 "I picked this flower for you... because I really, really like you."</button>
      <button class="soft" onclick="yesScreen('${f.name}')">🌟 "Every day is better with you in it. Will you be my special someone?"</button>
    </div>
  `);
}

function yesScreen(fname) {
  setBg("glade");
  const f = friends().find(x => x.name === fname);
  S.rel = S.rel || {}; S.rel[fname] = Math.max(3, S.rel[fname] || 0); try { postFeed(fname, `WE'RE ENGAGED!!! 💍 ${S.name} asked and I said YES!`); } catch (e) {}
  chime(); floatHearts(4); confetti();
  const grumbleLine = S.grumble >= 3
    ? `Even <b>Grumble, Sneer and Cackle</b> 🦡🦦🐦‍⬛ are there, waving little rainbow flags. "We're sorry we laughed at you," they say. "We were wrong. Love is love!" 🏳️‍🌈`
    : `Grumble, Sneer and Cackle watch from the back. They aren't laughing any more... and slowly, tiny smiles appear on their faces. 🙂`;
  show(`
    <div class="scene rainbow">
      <div class="pair"><span class="bob">${S.animal[0]}</span><span class="beat2" style="font-size:70px;align-self:center">💕</span><span class="bob two">${f.emo}</span></div>
      <div class="bubble" style="color:var(--ink)"><b>${f.name}:</b> "Yes! YES! 😭💕 I've been hoping you'd ask since the very first day. I used to think nobody would ever love me for who I am... and then I found you."</div>
    </div>
    <div class="box story center">
      <h2>🌈 ${esc(S.name)} & ${f.name} 🌈</h2>
      <p>The whole village of ${VILLAGE} throws a giant rainbow party for you both! 🎉</p>
      <p>${grumbleLine}</p>
      <p>You moved here feeling lonely. Now you have someone who loves you <b>exactly the way you are</b>. 💖</p>
      <button class="green" onclick="journeyScreen('${f.name}')">Plan the wedding! 💒</button>
    </div>
  `);
}

const GLADE = "the Secret Rainbow Glade";
const WED_PLACES = {
  arch:      { name:"Under the Blossom Arch",       icon:"🌸", bg:"url(art/garden.png) center/cover, linear-gradient(#ffd6ec,#c9f2c0)" },
  waterfall: { name:"Beside the Rainbow Waterfall", icon:"💧", bg:"url(art/glade.png) center/cover, linear-gradient(135deg,#ffb3b3,#ffe8a3,#c4f7b4,#a8e4ff,#d7b8ff)" },
  mushrooms: { name:"In the Glowing Mushroom Ring", icon:"🍄", bg:"url(art/glade.png) left bottom/cover, linear-gradient(#2a1d4f,#3f7a5a)" },
  lilies:    { name:"On the Moonlit Lily Pond",     icon:"🪷", bg:"url(art/stars.png) center/cover, linear-gradient(#1d2157,#3f6f9c)" }
};
const DARK_WED = ["mushrooms","lilies"];

function fireflies(n = 18) {
  let h = "";
  for (let k = 0; k < n; k++) h += `<span class="fly" style="left:${Math.random()*95}%;top:${Math.random()*85}%;animation-delay:${-Math.random()*4}s;animation-duration:${3+Math.random()*3}s"></span>`;
  return h;
}

function journeyScreen(fname) {
  setBg("glade");
  const f = friends().find(x => x.name === fname);
  show(`
    <div class="scene glade">
      ${fireflies(26)}
      <div class="pair walkacross" style="position:relative"><span class="bob">${S.animal[0]}</span><span class="bob two">${f.emo}</span></div>
    </div>
    <div class="box story">
      <p>Paw in paw, you and ${f.name} walk deep, deep into the forest... 🌲🌲🌲</p>
      <p>Past the whispering willows, over the mossy stones, through a curtain of glowing flowers...</p>
      <p>...until you find <b>${GLADE}</b>. ✨ A waterfall sparkles in every color of the rainbow, fireflies dance in the air, and the flowers glow softly pink and gold.</p>
      <p>The old animals say this magical place only appears for <b>true love</b>. 💕 And here it is, just for you two.</p>
      <div class="center"><button class="rainbow big-btn" onclick="weddingPlace('${f.name}')">Enter the glade ✨</button></div>
    </div>
  `);
}
const OUTFITS = [["🎀","Pink bow"],["🎩","Top hat"],["👑","Crown"],["🌸","Flower crown"],["🌈","Rainbow cape"],["🦋","Butterfly wings"]];

function weddingPlace(fname) {
  setBg("glade");
  const f = friends().find(x => x.name === fname);
  S.wed = { f: fname };
  show(`
    <div class="box center">
      <div class="big"><span class="bob">${S.animal[0]}</span>💍<span class="bob two">${f.emo}</span></div>
      <h2>Where in ${GLADE} will your wedding be?</h2>
      ${Object.entries(WED_PLACES).map(([k, p]) => `<button class="soft" onclick="S.wed.place='${k}';weddingOutfit()">${p.icon} ${p.name}</button>`).join("")}
    </div>
  `);
}

function weddingOutfit() {
  setBg("glade");
  const f = friends().find(x => x.name === S.wed.f);
  const pick = (who) => OUTFITS.map(([e, n]) =>
    `<button class="soft ${S.wed[who] === e ? "picked" : ""}" title="${n}" onclick="S.wed.${who}='${e}';weddingOutfit()">${itemPic(e)}<span class="lbl">${n}</span></button>`).join("");
  show(`
    <div class="box center">
      <h2>What will you wear? ${S.animal[0]}</h2>
      <div class="grid">${pick("me")}</div>
    </div>
    <div class="box center">
      <h2>What will ${f.name} wear? ${f.emo}</h2>
      <div class="grid">${pick("them")}</div>
    </div>
    ${S.wed.me && S.wed.them ? `<div class="center"><button class="rainbow big-btn" onclick="weddingVows()">Walk down the aisle 💒</button></div>` : ""}
  `);
}

function wedTop(mood = "aisle") {
  const f = friends().find(x => x.name === S.wed.f), p = WED_PLACES[S.wed.place];
  return `<div class="scene" style="background:${p.bg};${DARK_WED.includes(S.wed.place) ? "color:#fff" : ""}">
      ${fireflies(14)}
      <div class="place-name" style="color:var(--ink)">${p.icon} ${p.name}</div>
      <div class="center" style="font-size:60px">🦉</div>
      ${pair(`${itemPic(S.wed.me, "acc")}${S.animal[0]}`, `${itemPic(S.wed.them, "acc")}${f.emo}`, mood)}${mood === "boop" ? `<div class="burst" style="animation-delay:1.4s">💖</div>` : ""}
      <div class="center crowd">🐿️🦔🦌🐭🐺🐰🦝🐻</div>`;
}

function weddingVows() {
  const f = friends().find(x => x.name === S.wed.f);
  show(`
    ${wedTop()}
      <div class="bubble"><b>Olive the Owl:</b> "Friends of ${VILLAGE}, we are here to celebrate LOVE! 💕 ${esc(S.name)}, what would you like to say to ${f.name}?"</div>
    </div>
    <div class="box answers">
      <h2>Your wedding promise 💍</h2>
      <button class="soft" onclick="weddingKiss(0)">💕 "I promise to love you exactly the way you are, every single day."</button>
      <button class="soft" onclick="weddingKiss(1)">🌈 "You made me brave enough to be myself. I promise to always be by your side."</button>
      <button class="soft" onclick="weddingKiss(2)">🍯 "I promise to share my snacks, hold your paw, and laugh at all your jokes. Forever."</button>
    </div>
  `);
}

function weddingKiss(v) {
  const f = friends().find(x => x.name === S.wed.f);
  S.rel = S.rel || {}; S.rel[f.name] = 4;
  chime(); floatHearts(5); confetti();
  const grumble = S.grumble >= 3
    ? `<p>And in the front row... are those <b>Grumble, Sneer and Cackle</b> wiping away happy tears? 🥲 The animals who once laughed at you are now cheering the loudest! 📣</p>`
    : `<p>Even Grumble, Sneer and Cackle peek from behind a tree... and clap, just a little bit. 👏</p>`;
  show(`
    ${wedTop("boop")}
      <div class="bubble"><b>${f.name}:</b> "I promise to love you forever and ever, too. 🥹💕"</div>
      <div class="bubble"><b>Olive the Owl:</b> "Then by the power of the forest, I now pronounce you <b>partners for life!</b> You may share a nose boop! 🐽💕"</div>
    </div>
    <div class="box story center">
      <h2>🌈 Just Married! 🌈</h2>
      <p>Everyone in ${VILLAGE} cheers and throws flower petals! 🌸🌸🌸</p>
      <p>${friends()[3].name} the Bear baked a giant <b>six-layer rainbow wedding cake</b>, and everyone dances under the lanterns until the moon comes up. 🎂🌙💃</p>
      ${grumble}
      <button class="green" onclick="adoptScreen('${f.name}')">What happens next? 🏡</button>
    </div>
  `);
}

const BABIES = [["🦊","fox kit"],["🐰","baby bunny"],["🦝","baby raccoon"],["🐻","bear cub"],["🦔","baby hedgehog"],["🦉","little owlet"],["🐿️","baby squirrel"],["🦌","baby fawn"]];

function adoptScreen(fname, picked = null) {
  setBg("village");
  const f = friends().find(x => x.name === fname);
  show(`
    <div class="box story">
      <div class="center big"><span class="bob">${S.animal[0]}</span><span style="font-size:60px">🏡</span><span class="bob two">${f.emo}</span></div>
      <p><b>A few seasons after the wedding...</b> 🍂❄️🌸</p>
      <p>${esc(S.name)} and ${f.name} live together in a cozy little house in ${VILLAGE}. They want to start a family!</p>
      <p>Two ${word()} can't have babies of their own... but at the <b>Forest Nursery</b> there are little ones who are waiting for a loving home. 💕</p>
    </div>
    <div class="box center">
      <h2>Which little one will you adopt?</h2>
      <div class="grid">${BABIES.map(([e, n], k) =>
        `<button class="soft ${picked === k ? "picked" : ""}" title="${n}" onclick="adoptScreen('${f.name}',${k})">${e}</button>`).join("")}</div>
      ${picked !== null ? `
        <p class="story">You picked a <b>${BABIES[picked][1]}</b>! What will you name them?</p>
        <input id="baby" maxlength="14" placeholder="Baby's name">
        <div><button class="green" onclick="familyScreen('${f.name}',${picked})">Bring them home 🏡</button></div>` : ""}
    </div>
  `);
}

function familyScreen(fname, k) {
  setBg("garden");
  const f = friends().find(x => x.name === fname);
  const babyName = (document.getElementById("baby").value || "").trim() || "Little " + BABIES[k][1].split(" ").pop();
  chime(); floatHearts(4); confetti();
  show(`
    <div class="scene rainbow">
      <div class="pair"><span class="bob">${S.animal[0]}</span><span class="hopin" style="font-size:70px;align-self:flex-end">${BABIES[k][0]}</span><span class="bob two">${f.emo}</span></div>
      <div class="bubble" style="color:var(--ink)"><b>${esc(babyName)}:</b> "Do I really get two parents who love me? 🥺"</div>
    </div>
    <div class="box story center">
      <h2>🌈 The ${esc(S.name)} & ${f.name} Family 🌈</h2>
      <p>${esc(babyName)} has a home, a cozy bed, and two parents who love them more than all the stars in the sky. ✨</p>
      <p>Families come in all shapes and sizes. What makes a family is <b>love</b>. 💖</p>
      <h2>THE END</h2>
      ${finishStory(`${S.animal[0]} 💕 ${f.emo} and their baby ${BABIES[k][0]} ${esc(babyName)}`)}
    </div>
  `);
}

Promise.race([ART_READY, new Promise(r => setTimeout(r, 2500))]).then(titleScreen);
</script>
</body>
</html>
